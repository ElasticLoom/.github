name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security issues must not be reported here.** Use private vulnerability
        reporting from this repository's Security tab instead.

        Please remove secrets, internal hostnames and private paths from logs
        and configuration before posting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps or configuration that shows the problem.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release version or commit hash.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, kernel or runtime versions, and how the project is installed.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      render: text
